name: Run Job Scraper

# 2026-09-14, Jason: "i dont want this job running by itself". WAS: weekdays 12:00 UTC plus every push that
# touched the scraper, firms.csv, requirements or this file. Now it runs only from the Run workflow button,
# which the dashboard's "Run the finder" link opens.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write   # failure-notification step files/threads an issue

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # 2026-09-14: WAS a browser cache keyed "playwright-chromium-Linux-v1", a key that never changed. When
      # pip pulled Playwright 1.62 the cached browser was an older build ("Executable doesn't exist ...
      # chromium_headless_shell-1234"), so HGA and Perkins&Will failed on every run. Install fresh each run.
      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Run scraper
        run: |
          python -c "
          import job_scraper as s
          import os
          s.GITHUB_REPO_DIR = os.getcwd()
          s.run()
          "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # AUDIT 2026-08-06 #7 (added 2026-08-14): the scraper can exit 2 on a
      # degraded run (guards keep the previous dashboard live) -- but for three
      # audit cycles NOTHING TOLD ANYONE. This step turns any failed run into a
      # repo issue: it lands in Jason's GitHub notifications AND doubles as the
      # durable run-failure history the repo never had. Repeat failures thread
      # into the same open issue instead of spamming new ones.
      - name: Report failure as an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Scraper run FAILED (auto-filed) - dashboard held on last good version";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Run failed at ${new Date().toISOString()} - ${url}\n\n` +
              "The published dashboard was left on the previous good version. " +
              "Open the run log above for the PUBLISH ABORTED reason (collapse / majority errors / selector rot).";
            const {data: open} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 50});
            const hit = open.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: hit.number, body});
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body});
            }

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
